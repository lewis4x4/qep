# PR / main: parts pressure matrix (static), then full gate — migrations, cron guard,
# Deno edge check, service contracts + planner + vendor contract tests, web build.
# Requires Deno on PATH for scripts/deno-check-edge-functions.mjs
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Parts service pressure matrix (static)
        run: bun run pressure:parts

      # ── Knowledge-base gates ─────────────────────────────────────────
      # These three steps need external credentials (OpenAI + KB test
      # tokens) that do not exist as repo secrets today — with
      # *_REQUIRED=true they hard-failed unconditionally, which is how CI
      # went permanently red and got disabled in April (revived N7.1-era).
      # They skip loudly when their secrets are absent and re-arm as HARD
      # gates the moment the secrets are restored. Restore:
      #   gh secret set OPENAI_API_KEY / SUPABASE_ANON_KEY /
      #   KB_TEST_ADMIN_TOKEN / KB_TEST_REP_TOKEN / KB_ISOLATION_CASES
      - name: Knowledge retrieval eval
        if: ${{ secrets.OPENAI_API_KEY != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          KB_EVAL_REQUIRED: "true"
        run: node ./scripts/kb-eval/run-eval.mjs

      - name: Knowledge retrieval eval (skipped — secrets absent)
        if: ${{ secrets.OPENAI_API_KEY == '' }}
        run: echo "::warning::kb-eval SKIPPED — OPENAI_API_KEY repo secret not configured"

      - name: Knowledge base integration tests
        if: ${{ secrets.SUPABASE_ANON_KEY != '' && secrets.KB_TEST_ADMIN_TOKEN != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KB_TEST_ADMIN_TOKEN: ${{ secrets.KB_TEST_ADMIN_TOKEN }}
          KB_TEST_REP_TOKEN: ${{ secrets.KB_TEST_REP_TOKEN }}
          KB_INTEGRATION_REQUIRED: "true"
        run: bun run test:kb-integration

      - name: Knowledge base integration tests (skipped — secrets absent)
        if: ${{ secrets.SUPABASE_ANON_KEY == '' || secrets.KB_TEST_ADMIN_TOKEN == '' }}
        run: echo "::warning::kb-integration SKIPPED — SUPABASE_ANON_KEY / KB_TEST_* repo secrets not configured"

      - name: Knowledge workspace isolation
        if: ${{ secrets.KB_ISOLATION_CASES != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KB_ISOLATION_CASES: ${{ secrets.KB_ISOLATION_CASES }}
          KB_ISOLATION_REQUIRED: "true"
        run: node ./scripts/kb-eval/workspace-isolation.mjs

      - name: Knowledge workspace isolation (skipped — secrets absent)
        if: ${{ secrets.KB_ISOLATION_CASES == '' }}
        run: echo "::warning::kb-isolation SKIPPED — KB_ISOLATION_CASES repo secret not configured"

      - name: Voice field note regression tests
        run: |
          bun test \
            apps/web/src/lib/audio-recording-format.test.ts \
            apps/web/src/lib/voice-realtime-client.test.ts \
            apps/web/src/components/__tests__/VoiceCapturePage.integration.test.tsx
          deno test \
            supabase/functions/_shared/audio-mime.test.ts \
            supabase/functions/_shared/voice-transcript-signal.test.ts
          deno check \
            supabase/functions/voice-capture/index.ts \
            supabase/functions/voice-capture-sync/index.ts \
            supabase/functions/voice-realtime-session/index.ts \
            supabase/functions/voice-to-qrm/index.ts

      - name: Build (full gate)
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bun run build

      - name: Web bundle size guard (index entry)
        run: bun run bundle:check

      # WAVE Quality Tail (Slice 2): full test sweep using the per-file
      # subprocess runner. `bun run test` chains test:unit +
      # test:integration which both spawn each test file in its own
      # bun process — that's the only way around bun:test's process-
      # global `mock.module()` persistence, which is what made the
      # raw `bun test` sweep report ~31 cross-file pollution failures
      # in the polish/CI waves. Per-file isolation is the canonical
      # green-light signal; gating main on this catches regressions
      # immediately instead of waiting for the targeted sweep to
      # accidentally exercise the offending file order.
      - name: Full test sweep (per-file isolation)
        run: bun run test
